{% extends 'base.html' %}
{% block title %}{{ t('Add Advanced Expense') }}{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-header"><h3><i class="fas fa-plus"></i> {{ t('Add Advanced Expense') }}</h3></div>
    <div class="card-body">
      <form method="post" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label>{{ t('Date') }} *</label>
              <input type="date" name="expense_date" class="form-control" required>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label>{{ t('Category') }} *</label>
              <select name="category_id" class="form-control" required>
                {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name_ar }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label>{{ t('Amount') }} *</label>
              <input type="number" name="amount" class="form-control" step="0.01" required>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>{{ t('Description') }}</label>
          <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> {{ t('Save') }}</button>
        <a href="{{ url_for('advanced_ledger.advanced_expenses') }}" class="btn btn-secondary"><i class="fas fa-times"></i> {{ t('Cancel') }}</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
