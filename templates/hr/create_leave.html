{% extends 'base.html' %}
{% block title %}{{ t('Leave Request') }}{% endblock %}
{% block page_title %}<i class="fas fa-calendar-plus mr-2"></i>{{ t('New Leave Request') }}{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header"><h5 class="card-title mb-0">{{ t('Leave Request Details') }}</h5></div>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>{{ t('Employee') }} <span class="text-danger">*</span></label>
                <select name="employee_id" class="form-control" required>
                  <option value="">{{ t('Select Employee') }}</option>
                  {% for emp in employees %}
                  <option value="{{ emp.id }}">{{ emp.employee_number }} - {{ emp.user.full_name if emp.user else '' }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>{{ t('Leave Type') }} <span class="text-danger">*</span></label>
                <select name="leave_type_id" class="form-control" required>
                  <option value="">{{ t('Select Type') }}</option>
                  {% for lt in leave_types %}
                  <option value="{{ lt.id }}">{{ lt.name_ar or lt.name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>{{ t('Start Date') }} <span class="text-danger">*</span></label>
                <input type="date" name="start_date" class="form-control" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>{{ t('End Date') }} <span class="text-danger">*</span></label>
                <input type="date" name="end_date" class="form-control" required>
              </div>
            </div>
            <div class="col-12">
              <div class="form-group">
                <label>{{ t('Reason') }}</label>
                <textarea name="reason" class="form-control" rows="3" placeholder="{{ t('Enter the leave reason...') }}"></textarea>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane mr-2"></i>{{ t('Submit Request') }}</button>
          <a href="{{ url_for('hr.leave_requests') }}" class="btn btn-secondary">{{ t('Cancel') }}</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
