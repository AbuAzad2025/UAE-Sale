{% extends 'base.html' %}
{% block title %}إضافة فئة مصروفات{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-header"><h3><i class="fas fa-plus"></i> إضافة فئة مصروفات</h3></div>
    <div class="card-body">
      <form method="post" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label>الكود *</label>
              <input type="text" name="code" class="form-control" required>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label>الاسم *</label>
              <input type="text" name="name_ar" class="form-control" required>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label>الفئة الأب</label>
              <select name="parent_id" class="form-control">
                <option value="">لا يوجد</option>
                {% for parent in parent_categories %}
                <option value="{{ parent.id }}">{{ parent.name_ar }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label>الحساب المحاسبي *</label>
              <select name="gl_account_id" class="form-control" required>
                {% for account in accounts %}
                <option value="{{ account.id }}">{{ account.code }} - {{ account.name_ar }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> حفظ</button>
        <a href="{{ url_for('advanced_ledger.expense_categories') }}" class="btn btn-secondary"><i class="fas fa-times"></i> إلغاء</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
