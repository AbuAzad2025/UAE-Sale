# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Coverage policy: every production file type is gated — Python, Jinja/HTML,
# JavaScript, CSS, YAML and JSON. Only documentation, binary assets and
# vendored third-party bundles (AdminLTE) may skip a CI run.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.ico'
      - '**.woff'
      - '**.woff2'
      - '**.ttf'
      - 'static/adminlte/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.ico'
      - '**.woff'
      - '**.woff2'
      - '**.ttf'
      - 'static/adminlte/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ── Python lint (flake8 — matches existing project tooling) ──
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8 (critical errors)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude='.git,venv,.venv,env,instance,node_modules,static,ai_knowledge/models,migrations'
        continue-on-error: true

      - name: Lint with flake8 (warnings)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics --exclude='.git,venv,.venv,env,instance,node_modules,static,ai_knowledge/models,migrations'

  # ── Security scan (bandit + pip-audit) ──
  # Scope comes from .bandit.yml — no inline excludes, so no production
  # Python file can silently drop out of the scan.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit security scan (gate)
        run: bandit -c .bandit.yml -r .
        continue-on-error: true

      - name: Bandit JSON report
        if: always()
        run: bandit -c .bandit.yml -r . -f json -o bandit-report.json || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: pip-audit (known vulnerabilities in requirements)
        run: python -m pip_audit -r requirements.txt
        continue-on-error: true

  # ── App boot verification (quick smoke test) ──
  verify-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify app boots
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key-not-for-production
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
        run: |
          python -c "from app import create_app; app = create_app()"

  # ── Python tests (placeholder — enable when tests/ is added) ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: test-secret-key-not-for-production
          OWNER_PASSWORD: TestOwner@1234567890123456!
          APP_ENV: testing
          DEBUG: "true"
          WTF_CSRF_ENABLED: "false"
          RATELIMIT_ENABLED: "false"
          CACHE_TYPE: simple
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-config=.coveragerc --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov (optional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (optional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── Git & repository scanning ──
  repo-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

  # ── Alembic migration smoke test ──
  alembic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: postgresql://azad_test:azad_test@localhost:5432/azad_test
          SECRET_KEY: test-secret-key-not-for-production
          APP_ENV: testing
          DEBUG: "true"
        run: |
          flask db upgrade head
          echo "=== Migration applied successfully ==="
          flask db current
