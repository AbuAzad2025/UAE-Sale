{% extends 'base.html' %}
{% block title %}طلب إجازة{% endblock %}
{% block page_title %}<i class="fas fa-calendar-plus mr-2"></i>طلب إجازة جديد{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header"><h5 class="card-title mb-0">بيانات طلب الإجازة</h5></div>
      <form method="POST">
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label>الموظف <span class="text-danger">*</span></label>
                <select name="employee_id" class="form-control" required>
                  <option value="">— اختر موظف —</option>
                  {% for emp in employees %}
                  <option value="{{ emp.id }}">{{ emp.employee_number }} - {{ emp.user.full_name if emp.user else '' }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>نوع الإجازة <span class="text-danger">*</span></label>
                <select name="leave_type_id" class="form-control" required>
                  <option value="">— اختر النوع —</option>
                  {% for lt in leave_types %}
                  <option value="{{ lt.id }}">{{ lt.name_ar or lt.name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>تاريخ البداية <span class="text-danger">*</span></label>
                <input type="date" name="start_date" class="form-control" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <label>تاريخ النهاية <span class="text-danger">*</span></label>
                <input type="date" name="end_date" class="form-control" required>
              </div>
            </div>
            <div class="col-12">
              <div class="form-group">
                <label>السبب</label>
                <textarea name="reason" class="form-control" rows="3" placeholder="أدخل سبب الإجازة..."></textarea>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane mr-2"></i>تقديم الطلب</button>
          <a href="{{ url_for('hr.leave_requests') }}" class="btn btn-secondary">إلغاء</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
