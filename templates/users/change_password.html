{% extends "base.html" %}

{% block title %}تغيير كلمة المرور{% endblock %}

{% block content %}
<div class="content-wrapper" dir="rtl">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1>🔒 تغيير كلمة المرور</h1>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card card-outline card-warning">
                        <div class="card-header">
                            <h3 class="card-title">
                                <i class="fas fa-key"></i>
                                تحديث كلمة المرور
                            </h3>
                        </div>
                        <form method="POST" action="{{ url_for('users.change_password') }}">
                            <div class="card-body">
                                <div class="form-group">
                                    <label for="current_password">
                                        <i class="fas fa-lock"></i> كلمة المرور الحالية
                                    </label>
                                    <input type="password" class="form-control" id="current_password"
                                           name="current_password" required autocomplete="current-password">
                                </div>

                                <hr>
                                <h5 class="text-muted">كلمة المرور الجديدة</h5>

                                <div class="form-group">
                                    <label for="new_password">
                                        <i class="fas fa-key"></i> كلمة المرور الجديدة
                                    </label>
                                    <input type="password" class="form-control" id="new_password"
                                           name="new_password" required autocomplete="new-password"
                                           minlength="10">
                                    <small class="form-text text-muted">
                                        الحد الأدنى: 10 أحرف، حرف كبير، حرف صغير، رقم، ورمز خاص
                                    </small>
                                </div>

                                <div class="form-group">
                                    <label for="confirm_password">
                                        <i class="fas fa-check-double"></i> تأكيد كلمة المرور الجديدة
                                    </label>
                                    <input type="password" class="form-control" id="confirm_password"
                                           name="confirm_password" required autocomplete="new-password"
                                           minlength="10">
                                </div>
                            </div>

                            <div class="card-footer">
                                <button type="submit" class="btn btn-warning">
                                    <i class="fas fa-save"></i> حفظ كلمة المرور الجديدة
                                </button>
                                <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-right"></i> إلغاء
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
{% endblock %}
