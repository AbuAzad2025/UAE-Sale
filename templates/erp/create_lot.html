{% extends 'base.html' %}
{% block title %}إضافة دفعة{% endblock %}
{% block page_title %}<i class="fas fa-plus mr-2"></i>إضافة دفعة منتج{% endblock %}
{% block content %}
<div class="row"><div class="col-lg-8">
<div class="card"><div class="card-body">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row">
      <div class="col-md-6"><div class="form-group"><label>المنتج <span class="text-danger">*</span></label><select name="product_id" class="form-control" required><option value="">— اختر —</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div></div>
      <div class="col-md-6"><div class="form-group"><label>رقم الدفعة <span class="text-danger">*</span></label><input type="text" name="lot_number" class="form-control" required></div></div>
      <div class="col-md-4"><div class="form-group"><label>المستودع</label><select name="warehouse_id" class="form-control"><option value="">— اختر —</option>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select></div></div>
      <div class="col-md-4"><div class="form-group"><label>الكمية</label><input type="number" name="quantity" class="form-control" step="0.01" value="0"></div></div>
      <div class="col-md-4"><div class="form-group"><label>تكلفة الوحدة</label><input type="number" name="cost_price" class="form-control" step="0.01" value="0"></div></div>
      <div class="col-md-4"><div class="form-group"><label>تاريخ الإنتاج</label><input type="date" name="manufacture_date" class="form-control"></div></div>
      <div class="col-md-4"><div class="form-group"><label>تاريخ الانتهاء</label><input type="date" name="expiry_date" class="form-control"></div></div>
    </div>
    <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-2"></i>حفظ</button>
    <a href="{{ url_for('erp_modules.lots') }}" class="btn btn-secondary">إلغاء</a>
  </form>
</div></div>
</div></div>
{% endblock %}
