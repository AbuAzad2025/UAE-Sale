{% extends 'base.html' %}
{% block title %}إضافة قسم{% endblock %}
{% block page_title %}<i class="fas fa-building mr-2"></i>إضافة قسم جديد{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header"><h5 class="card-title mb-0">بيانات القسم</h5></div>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-body">
          {% include 'hr/_department_fields.html' %}
        </div>
        <div class="card-footer">
          <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-2"></i>حفظ</button>
          <a href="{{ url_for('hr.departments') }}" class="btn btn-secondary">إلغاء</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
