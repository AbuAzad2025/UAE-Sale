{% extends 'base.html' %}
{% block title %}إدارة العملات{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="mb-3">
    <a href="{{ url_for('owner.dashboard') }}" class="btn btn-secondary">
      <i class="fas fa-arrow-right"></i> رجوع للوحة المالك
    </a>
    <a href="{{ url_for('owner.tax_settings') }}" class="btn btn-success">
      <i class="fas fa-percent"></i> الضرائب
    </a>
    <a href="{{ url_for('owner.payment_gateways') }}" class="btn btn-primary">
      <i class="fas fa-credit-card"></i> بوابات الدفع
    </a>
  </div>
  <div class="card">
    <div class="card-header">
      <h3><i class="fas fa-dollar-sign"></i> إدارة العملات</h3>
    </div>
    <div class="card-body">
      <form method="post" action="" class="mb-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="form-group">
          <label>العملة الافتراضية</label>
          <select name="default_currency" class="form-control">
            <option value="AED" {% if settings.default_currency == 'AED' %}selected{% endif %}>AED - درهم إماراتي</option>
            <option value="USD" {% if settings.default_currency == 'USD' %}selected{% endif %}>USD - دولار أمريكي</option>
            <option value="EUR" {% if settings.default_currency == 'EUR' %}selected{% endif %}>EUR - يورو</option>
            <option value="SAR" {% if settings.default_currency == 'SAR' %}selected{% endif %}>SAR - ريال سعودي</option>
          </select>
        </div>
        
        <div class="form-group">
          <div class="custom-control custom-switch">
            <input type="checkbox" 
                   class="custom-control-input" 
                   id="auto_update" 
                   name="auto_update_rates" 
                   {% if settings.auto_update_rates %}checked{% endif %}>
            <label class="custom-control-label" for="auto_update">
              تحديث تلقائي لأسعار الصرف
            </label>
          </div>
        </div>
        
        <button type="submit" class="btn btn-success">
          <i class="fas fa-save"></i> حفظ
        </button>
      </form>
      
      <h5 class="mt-4 mb-3">أسعار الصرف الحالية</h5>
      <table class="table table-bordered">
        <thead class="thead-light">
          <tr>
            <th>العملة</th>
            <th>السعر (AED)</th>
          </tr>
        </thead>
        <tbody>
          {% for currency, rate in rates.items() %}
          <tr>
            <td><strong>{{ currency }}</strong></td>
            <td>{{ rate }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
