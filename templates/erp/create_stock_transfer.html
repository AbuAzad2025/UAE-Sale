{% extends 'base.html' %}
{% block title %}طلب نقل مخزون{% endblock %}
{% block page_title %}<i class="fas fa-plus mr-2"></i>طلب نقل مخزون{% endblock %}
{% block content %}
<form method="POST">
  <div class="card"><div class="card-body">
    <div class="row">
      <div class="col-md-4"><div class="form-group"><label>من مستودع <span class="text-danger">*</span></label><select name="from_warehouse_id" class="form-control" required><option value="">— اختر —</option>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select></div></div>
      <div class="col-md-4"><div class="form-group"><label>إلى مستودع <span class="text-danger">*</span></label><select name="to_warehouse_id" class="form-control" required><option value="">— اختر —</option>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select></div></div>
    </div>
  </div></div>
  <div class="card"><div class="card-header"><h5 class="mb-0">المنتجات</h5></div><div class="card-body">
    <table class="table" id="lines-table"><thead><tr><th>المنتج</th><th>الكمية</th><th></th></tr></thead><tbody></tbody></table>
    <button type="button" class="btn btn-success btn-sm" onclick="addLine()"><i class="fas fa-plus mr-1"></i>إضافة منتج</button>
  </div></div>
  <div class="card"><div class="card-body">
    <div class="form-group"><label>ملاحظات</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
    <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save mr-2"></i>إنشاء طلب النقل</button>
  </div></div>
</form>
<script>
var i=0;var products=[{% for p in products %}{id:{{p.id}},name:'{{p.name}}'}{% if not loop.last %},{% endif %}{% endfor %}];
function addLine(){$('#lines-table tbody').append('<tr><td><select name="lines['+i+'][product_id]" class="form-control"><option value="">— اختر —</option>'+products.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>'}).join('')+'</select></td><td><input type="number" name="lines['+i+'][quantity]" class="form-control" step="0.01" required></td><td><button type="button" class="btn btn-danger btn-sm" onclick="$(this).closest(\'tr\').remove()"><i class="fas fa-trash"></i></button></td></tr>');i++}
addLine();
</script>
{% endblock %}
