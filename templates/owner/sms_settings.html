{% extends 'base.html' %}
{% block title %}إعدادات الرسائل{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="mb-3">
    <a href="{{ url_for('owner.dashboard') }}" class="btn btn-secondary">
      <i class="fas fa-arrow-right"></i> رجوع للوحة المالك
    </a>
    <a href="{{ url_for('owner.email_settings') }}" class="btn btn-info">
      <i class="fas fa-envelope"></i> البريد
    </a>
    <a href="{{ url_for('owner.whatsapp_settings') }}" class="btn btn-success">
      <i class="fab fa-whatsapp"></i> واتساب
    </a>
  </div>
  <div class="card">
    <div class="card-header">
      <h3><i class="fas fa-sms"></i> إعدادات الرسائل النصية</h3>
    </div>
    <div class="card-body">
      <form method="post" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="form-group">
          <label>مزود الخدمة</label>
          <select name="sms_provider" class="form-control">
            <option value="" {% if not settings.sms_provider %}selected{% endif %}>بلا</option>
            <option value="twilio" {% if settings.sms_provider == 'twilio' %}selected{% endif %}>Twilio</option>
            <option value="nexmo" {% if settings.sms_provider == 'nexmo' %}selected{% endif %}>Nexmo (Vonage)</option>
            <option value="local" {% if settings.sms_provider == 'local' %}selected{% endif %}>مزود محلي</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>API Key</label>
          <input type="password" 
                 name="sms_api_key" 
                 class="form-control" 
                 value="{{ settings.sms_api_key or '' }}"
                 placeholder="API Key من المزود">
        </div>
        
        <div class="form-group">
          <label>اسم المرسل</label>
          <input type="text" 
                 name="sms_sender_name" 
                 class="form-control" 
                 value="{{ settings.sms_sender_name or '' }}"
                 placeholder="Azad Garage"
                 maxlength="11">
          <small class="text-muted">الحد الأقصى 11 حرف</small>
        </div>
        
        <div class="form-group">
          <div class="custom-control custom-switch">
            <input type="checkbox" 
                   class="custom-control-input" 
                   id="sms_enabled" 
                   name="sms_enabled" 
                   {% if settings.sms_enabled %}checked{% endif %}>
            <label class="custom-control-label" for="sms_enabled">
              تفعيل الرسائل النصية
            </label>
          </div>
        </div>
        
        <button type="submit" class="btn btn-success btn-lg">
          <i class="fas fa-save"></i> حفظ
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
