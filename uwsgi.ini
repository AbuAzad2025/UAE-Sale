; uWSGI configuration for PythonAnywhere.
;
; PythonAnywhere does NOT read this file for a plain web app - it serves
; Flask through its own uWSGI setup and only needs wsgi.py pointed at. It
; IS used by a container deployment (Dockerfile / docker-compose.yml) and by
; a self-managed server, so it is kept here for those cases.
;
;   uwsgi --ini uwsgi.ini
;
; For PythonAnywhere:
;   Web tab -> WSGI configuration file -> /home/<user>/<repo>/wsgi.py
;   Web tab -> Virtualenv -> /home/<user>/<repo>/venv

[uwsgi]
; The WSGI callable. wsgi.py exposes it as `application`.
module = wsgi
callable = application

; Paths. The chdir must be the repository root so that `instance/`, the
; knowledge directories and the templates resolve relative to the code.
chdir = %d/..
pythonpath = %d/..
; On PythonAnywhere the virtualenv lives beside the repository:
;   pythonpath = /home/<user>/<repo>/venv/bin

; Socket. Use a TCP port for a container (published to the host) and a Unix
; socket when a reverse proxy sits in front.
; socket = /tmp/azad-erp.sock
; master = true
; processes = 2
; threads = 4
; vacuum = true

; Reload on code change - convenient in development, remove in production.
; reload = true
; py-autoreload = true

; Logging. PythonAnywhere captures stdout/stderr itself, so these lines only
; matter for a container.
; log = -
; log-4xx = -
; log-5xx = -
; disable-logging = false

; Uploads. The app allows MAX_CONTENT_LENGTH_MB (16 by default) and the
; uploader must match, otherwise large uploads are rejected.
; buffer-size = 32768

; Keep the process alive across deploys.
; vacuum = true
; die-on-term = true

; Environment. These are overridden by the environment variables set in the
; PythonAnywhere Web tab; they are the fallback for a container.
env = APP_ENV=production
env = CACHE_TYPE=flask_caching.backends.SimpleCache
env = TENANT_STRICT=true
; Set the real ones in the platform's environment, NOT here:
; env = DATABASE_URL=postgresql://user:password@host/dbname
; env = SECRET_KEY=...
; env = OWNER_PASSWORD=...
