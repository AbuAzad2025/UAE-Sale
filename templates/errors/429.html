{% extends 'base.html' %}

{% block title %}429 - {{ t('High Request Volume') }}{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body text-center p-5">
          <h1 class="display-4 text-warning mb-3">429</h1>
          <h3 class="mb-4">{{ t('Too Many Requests') }}</h3>
          <p class="text-muted mb-4">
            {{ t('Sorry, you have made too many requests. Please wait a moment and try again.') }}
          </p>
          <div class="mt-4">
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
              {{ t('Back to Home') }}
            </a>
            <a href="javascript:location.reload()" class="btn btn-secondary">
              {{ t('Retry') }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
