<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="شركة سمرقند للمقاولات - Samarkand Contracting Co.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00924a"/>
      <stop offset="100%" stop-color="#00632f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d27a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#003d1c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- outer badge -->
  <circle cx="256" cy="256" r="244" fill="url(#bg)" stroke="url(#gold)" stroke-width="10" filter="url(#sh)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- stylised construction / tower mark: three rising pillars + dome -->
  <g fill="url(#gold)">
    <path d="M150 318 h44 v-96 h-44 z"/>
    <path d="M234 318 h44 v-150 h-44 z"/>
    <path d="M318 318 h44 v-96 h-44 z"/>
    <path d="M256 108 c-46 0 -78 32 -78 70 h156 c0 -38 -32 -70 -78 -70 z"/>
  </g>
  <rect x="128" y="326" width="256" height="16" rx="6" fill="#ffffff" fill-opacity="0.92"/>

  <!-- company name (Arabic) -->
  <text x="256" y="392" text-anchor="middle" fill="#ffffff" font-family="Tajawal, Noto Kufi Arabic, Arial, sans-serif" font-size="54" font-weight="700">سمرقند</text>
  <text x="256" y="430" text-anchor="middle" fill="url(#gold)" font-family="Tajawal, Noto Kufi Arabic, Arial, sans-serif" font-size="30" font-weight="700">للمقاولات</text>
  <text x="256" y="462" text-anchor="middle" fill="#ffffff" fill-opacity="0.8" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">SAMARKAND CONTRACTING</text>
</svg>
