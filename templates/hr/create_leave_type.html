{% extends 'base.html' %}
{% block title %}{{ t('Add Leave Type') }}{% endblock %}
{% block page_title %}<i class="fas fa-plus mr-2"></i>{{ t('Add Leave Type') }}{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header"><h5 class="card-title mb-0">{{ t('Leave Type Details') }}</h5></div>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-body">
          <div class="form-group">
            <label>{{ t('Code') }} *</label>
            <input type="text" name="code" class="form-control" maxlength="20" dir="ltr" required>
          </div>
          <div class="form-group">
            <label>{{ t('Name') }} *</label>
            <input type="text" name="name" class="form-control" maxlength="50" required>
          </div>
          <div class="form-group">
            <label>{{ t('Name in Arabic') }}</label>
            <input type="text" name="name_ar" class="form-control" maxlength="50">
          </div>
          <div class="form-group">
            <label>{{ t('Default Days') }}</label>
            <input type="number" name="default_days" class="form-control" value="0" min="0" max="365">
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" name="is_paid" id="is_paid" class="form-check-input" checked>
            <label class="form-check-label" for="is_paid">{{ t('Paid Leave') }}</label>
          </div>
          <div class="form-group">
            <label>{{ t('Description') }}</label>
            <textarea name="description" class="form-control" rows="2"></textarea>
          </div>
        </div>
        <div class="card-footer">
          <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-2"></i>{{ t('Save') }}</button>
          <a href="{{ url_for('hr.leave_types') }}" class="btn btn-secondary">{{ t('Cancel') }}</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
