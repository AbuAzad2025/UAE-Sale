{% extends "base.html" %}
{% block title %}إعدادات الشركة — {{ tenant.name_ar or tenant.name }}{% endblock %}

{% block content %}
<div class="content-wrapper" dir="rtl">
  <section class="content-header">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center">
        <h1>إعدادات الشركة</h1>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">
          <i class="fas fa-arrow-right mr-1"></i> العودة للوحة التحكم
        </a>
      </div>
    </div>
  </section>
  <section class="content">
    <div class="container-fluid">
      <form method="POST" action="{{ request.path }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="card card-outline card-primary">
          <div class="card-header"><h3 class="card-title">الهوية والشعارات</h3></div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-6"><div class="form-group">
                <label>الاسم بالعربية</label>
                <input type="text" name="name_ar" class="form-control" value="{{ tenant.name_ar or '' }}" required>
              </div></div>
              <div class="col-md-6"><div class="form-group">
                <label>الاسم بالإنجليزية</label>
                <input type="text" name="name_en" class="form-control" value="{{ tenant.name_en or '' }}">
              </div></div>
              <div class="col-md-4"><div class="form-group">
                <label>رابط الشعار (فاتح)</label>
                <input type="text" name="logo_url" class="form-control" value="{{ tenant.logo_url or '' }}">
              </div></div>
              <div class="col-md-4"><div class="form-group">
                <label>رابط الشعار (داكن)</label>
                <input type="text" name="logo_dark_url" class="form-control" value="{{ tenant.logo_dark_url or '' }}">
              </div></div>
              <div class="col-md-4"><div class="form-group">
                <label>رابط الأيقونة (Favicon)</label>
                <input type="text" name="favicon_url" class="form-control" value="{{ tenant.favicon_url or '' }}">
              </div></div>
              <div class="col-md-6"><div class="form-group">
                <label>اللون الأساسي</label>
                <input type="color" name="brand_color_primary" class="form-control" value="{{ tenant.brand_color_primary or '#007A3D' }}">
              </div></div>
              <div class="col-md-6"><div class="form-group">
                <label>اللون الثانوي</label>
                <input type="color" name="brand_color_secondary" class="form-control" value="{{ tenant.brand_color_secondary or '#D4AF37' }}">
              </div></div>
            </div>
          </div>
        </div>

        <div class="card card-outline card-info">
          <div class="card-header"><h3 class="card-title">بيانات الاتصال والعنوان</h3></div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-6"><div class="form-group">
                <label>الهاتف 1</label><input type="text" name="phone_1" class="form-control" value="{{ tenant.phone_1 or '' }}">
              </div></div>
              <div class="col-md-6"><div class="form-group">
                <label>الهاتف 2</label><input type="text" name="phone_2" class="form-control" value="{{ tenant.phone_2 or '' }}">
              </div></div>
              <div class="col-md-6"><div class="form-group">
                <label>الجوال</label><input type="text" name="mobile" class="form-control" value="{{ tenant.mobile or '' }}">
              </div></div>
              <div class="col-md-6"><div class="form-group">
                <label>البريد الإلكتروني</label><input type="email" name="email" class="form-control" value="{{ tenant.email or '' }}">
              </div></div>
              <div class="col-md-12"><div class="form-group">
                <label>العنوان (عربي)</label><input type="text" name="address_ar" class="form-control" value="{{ tenant.address_ar or '' }}">
              </div></div>
              <div class="col-md-6"><div class="form-group">
                <label>المدينة</label><input type="text" name="city" class="form-control" value="{{ tenant.city or '' }}">
              </div></div>
              <div class="col-md-6"><div class="form-group">
                <label>الدولة</label><input type="text" name="country" class="form-control" value="{{ tenant.country or '' }}">
              </div></div>
              <div class="col-md-12"><div class="form-group">
                <label>الموقع الإلكتروني</label><input type="text" name="website" class="form-control" value="{{ tenant.website or '' }}">
              </div></div>
            </div>
          </div>
        </div>

        <div class="card card-outline card-warning">
          <div class="card-header"><h3 class="card-title">الإعدادات المالية والضريبية</h3></div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-4"><div class="form-group">
                <label>العملة الأساسية</label>
                <select name="default_currency" class="form-control">
                  {% for c in ['ILS','JOD','AED','USD','EUR','GBP','SAR','KWD','QAR','OMR','BHD'] %}
                  <option value="{{ c }}" {% if tenant.default_currency == c %}selected{% endif %}>{{ c }}</option>
                  {% endfor %}
                </select>
              </div></div>
              <div class="col-md-4"><div class="form-group">
                <label>نسبة الضريبة %</label>
                <input type="number" step="0.01" name="default_tax_rate" class="form-control" value="{{ tenant.default_tax_rate or 0 }}">
              </div></div>
              <div class="col-md-4"><div class="form-group">
                <label>دولة الضريبة</label><input type="text" name="tax_country" class="form-control" value="{{ tenant.tax_country or '' }}">
              </div></div>
              <div class="col-md-6"><div class="form-group">
                <label>الرقم الضريبي</label><input type="text" name="tax_number" class="form-control" value="{{ tenant.tax_number or '' }}">
              </div></div>
              <div class="col-md-6"><div class="form-group">
                <label>السجل التجاري</label><input type="text" name="commercial_register" class="form-control" value="{{ tenant.commercial_register or '' }}">
              </div></div>
              <div class="col-md-6">
                <label class="custom-control custom-checkbox"><input type="checkbox" name="enable_tax" class="custom-control-input" {% if tenant.enable_tax %}checked{% endif %}><span class="custom-control-label">تفعيل الضريبة</span></label>
              </div>
              <div class="col-md-6">
                <label class="custom-control custom-checkbox"><input type="checkbox" name="tax_inclusive" class="custom-control-input" {% if tenant.tax_inclusive %}checked{% endif %}><span class="custom-control-label">الأسعار شاملة الضريبة</span></label>
              </div>
              <div class="col-md-6">
                <label class="custom-control custom-checkbox"><input type="checkbox" name="enable_multi_currency" class="custom-control-input" {% if tenant.enable_multi_currency %}checked{% endif %}><span class="custom-control-label">تفعيل تعدد العملات</span></label>
              </div>
            </div>
          </div>
        </div>

        <div class="card card-outline card-secondary">
          <div class="card-header"><h3 class="card-title">بيانات البنك</h3></div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-6"><div class="form-group"><label>البنك</label><input type="text" name="bank_name" class="form-control" value="{{ tenant.bank_name or '' }}"></div></div>
              <div class="col-md-6"><div class="form-group"><label>رقم الحساب</label><input type="text" name="bank_account_number" class="form-control" value="{{ tenant.bank_account_number or '' }}"></div></div>
              <div class="col-md-6"><div class="form-group"><label>IBAN</label><input type="text" name="iban" class="form-control" value="{{ tenant.iban or '' }}"></div></div>
              <div class="col-md-6"><div class="form-group"><label>SWIFT</label><input type="text" name="swift_code" class="form-control" value="{{ tenant.swift_code or '' }}"></div></div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> حفظ الإعدادات</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
