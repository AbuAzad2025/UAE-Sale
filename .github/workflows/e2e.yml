# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: E2E

# The 5880-scenario matrix takes ~2.5h as one sequential run, so it is split
# across a GitHub Actions matrix: 7 domains x 2 shards = 14 parallel jobs.
# Each job owns a private SQLite file (tests/e2e/conftest.py:67), so the shards
# need no shared database and cannot interfere with one another.
on:
  push:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'routes/**'
      - 'services/**'
      - 'models/**'
      - 'utils/**'
      - 'harness.py'
      - 'config.py'
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'routes/**'
      - 'services/**'
      - 'models/**'
      - 'utils/**'
      - 'harness.py'
      - 'config.py'
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    # Nightly guard: catches defects that only appear as data accumulates.
    - cron: '17 3 * * *'

concurrency:
  # The group includes github.event_name so the nightly schedule cannot cancel
  # a push run that is still verifying. Without it, a push landing near the
  # 03:17 cron was killed mid-flight and reported as 'cancelled' even though
  # every job was green so far.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  SECRET_KEY: 'test-secret-key-not-for-production'
  OWNER_PASSWORD: 'TestOwner1234567890123456'
  APP_ENV: 'testing'
  DEBUG: 'true'
  WTF_CSRF_ENABLED: 'false'
  RATELIMIT_ENABLED: 'false'
  CACHE_TYPE: 'simple'
  PYTHONIOENCODING: 'utf-8'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  # ── The 70 hand-verified vertical tests: foundations plus one file per
  #    domain. Fast enough (~5 min) to always run in full.
  slice:
    name: slice (vertical suites)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run vertical suites
        run: |
          set -o pipefail
          pytest tests/e2e/ \
            --ignore=tests/e2e/test_matrix.py \
            -q -p no:randomly \
            --tb=short \
            --e2e-route-report routes-slice.json \
            --junitxml=slices.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-slices
          # The route-report is what makes endpoint coverage visible. Without
          # it the vertical suites' 275 tests were invisible to the census:
          # the summary job only reads artifacts/**/routes-*.json, so
          # /sales/*, /expenses/*, /products/*, /customers/* and every other
          # route these suites exercise were reported as uncovered.
          path: |
            slices.xml
            routes-slice.json
          if-no-files-found: error
          retention-days: 14

  # ── The combinatorial matrix. One job per (domain, shard).
  matrix:
    name: ${{ matrix.domain }} (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        domain: [accounting, ar, ap, inventory, cheque, payments, security, hr, approvals, shipments, expenses, returns, reports, partners, dashboard, stock, customers, analytics, quotations, vault, gamification, inbound, owner, users, restapi, ai, erp, advanced, suppliers, platform]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run matrix domain
        # --e2e-shard-id/--e2e-num-shards are defined in
        # tests/e2e/conftest.py. pytest-shard was rejected because it does not
        # compose with -k (it reported 3368 and 3352 for an 840-test domain).
        #
        # The junit file is named with the lowercase domain on both sides. It
        # used to be written as matrix-$PREFIX-<shard>.xml (uppercase) while
        # the upload looked for matrix-<domain>-<shard>.xml, so all 44 jobs ran
        # green and uploaded nothing - the run summary reported only the slice
        # job's 70 tests.
        run: |
          set -o pipefail
          DOMAIN='${{ matrix.domain }}'
          PREFIX=$(echo "$DOMAIN" | cut -c1-3 | tr '[:lower:]' '[:upper:]')
          echo "Running domain $DOMAIN (prefix $PREFIX), shard ${{ matrix.shard }}/2"
          pytest tests/e2e/test_matrix.py \
            -k "E2E-$PREFIX-" \
            -q -p no:randomly \
            --tb=short \
            --e2e-shard-id ${{ matrix.shard }} \
            --e2e-num-shards 2 \
            --e2e-route-report routes-$DOMAIN-${{ matrix.shard }}.json \
            --junitxml=matrix-$DOMAIN-${{ matrix.shard }}.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-matrix-${{ matrix.domain }}-${{ matrix.shard }}
          # The route-report is what makes endpoint coverage visible. Without
          # it a green run says nothing about which parts of the application
          # the scenarios actually reached.
          path: |
            matrix-${{ matrix.domain }}-${{ matrix.shard }}.xml
            routes-${{ matrix.domain }}-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  # ── Prove the matrix is still the shape the report claims, so a silent
  #    dimension change cannot shrink coverage without anyone noticing.
  matrix-shape:
    name: matrix shape
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # The summary job derives its artifact count from this instead of
      # importing the package, which it has no dependencies installed for.
      domains: ${{ steps.inventory.outputs.domains }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Assert scenario inventory
        id: inventory
        run: |
          python - <<'PY'
          from tests.e2e.matrix import (
              MATRIX, DOMAINS, ROLES, STATES, EDGES, NEW_EDGE_STATES)
          import collections, os, re
          print('scenarios      :', len(MATRIX))
          print('unique ids     :', len({s.id for s in MATRIX}))
          print('distinct amounts:', len({s.amount for s in MATRIX}))
          print('dimensions     :', len(DOMAINS), 'x', len(ROLES), 'x',
                len(STATES), 'x', len(EDGES))
          per = collections.Counter(s.domain for s in MATRIX)
          for d in DOMAINS:
              print(f'  {d:<12} {per[d]}')
          assert len(MATRIX) == 28350, f'matrix is {len(MATRIX)}, expected 28350'
          assert len({s.id for s in MATRIX}) == len(MATRIX), 'duplicate ids'
          assert len({s.amount for s in MATRIX}) == len(MATRIX), \
              'duplicate amounts would collapse assertions'
          # every expansion dimension must be implemented, not silently ignored
          for d in NEW_EDGE_STATES:
              assert d in EDGES or d in STATES, f'{d} is unreachable'
          # The workflow's own matrix list must cover every domain. Without
          # this, a domain added to matrix.py never runs in CI while the run
          # still reports success.
          wf = open('.github/workflows/e2e.yml', encoding='utf-8').read()
          m = re.search(r'domain:\s*\[([^\]]*)\]', wf)
          assert m, 'could not read the workflow domain list'
          ci_domains = [x.strip() for x in m.group(1).split(',') if x.strip()]
          missing = [d for d in DOMAINS if d not in ci_domains]
          extra = [d for d in ci_domains if d not in DOMAINS]
          assert not missing, f'domains missing from CI matrix: {missing}'
          assert not extra, f'CI matrix runs unknown domains: {extra}'
          print('CI domains cover all', len(DOMAINS), 'matrix domains')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'domains={len(DOMAINS)}\n')
          print('OK')
          PY

  # ── Aggregate every junit file into one run-page summary.
  summary:
    name: summary
    needs: [slice, matrix, matrix-shape]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The coverage census imports the application to enumerate its url_map,
      # so this job needs the source tree. It never needed it before: parsing
      # junit only requires the standard library.
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/download-artifact@v6
        with:
          pattern: e2e-*
          path: artifacts
          merge-multiple: false
      - name: Build summary
        env:
          E2E_DOMAINS: ${{ needs.matrix-shape.outputs.domains }}
        run: |
          python - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          total = fails = errs = skipped = 0
          rows = []
          # Every matrix job names its file matrix-<PREFIX>-<shard>.xml and the
          # slice job writes slices.xml. download-artifact nests each artifact
          # in its own directory, so the recursive glob below is what actually
          # picks all 45 of them up; a flat glob silently summarised one file
          # and reported a misleadingly small total.
          paths = sorted(glob.glob('artifacts/**/*.xml', recursive=True))
          print('files found:', len(paths))
          # This job installs no requirements, so it cannot import tests.e2e. The
          # domain count comes from the matrix-shape job's output instead.
          expected = int(os.environ['E2E_DOMAINS']) * 2 + 1
          if len(paths) < expected:
              raise SystemExit(
                  f'only {len(paths)} of {expected} expected junit files were '
                  f'parsed: {paths}')
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  print('skip', path, exc)
                  continue
              t = f = e = s = 0
              for suite in root.iter('testsuite'):
                  t += int(suite.get('tests', 0))
                  f += int(suite.get('failures', 0))
                  e += int(suite.get('errors', 0))
                  s += int(suite.get('skipped', 0))
              rows.append((os.path.basename(path), t, f, e, s))
              total += t; fails += f; errs += e; skipped += s
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('## E2E matrix summary\n\n')
              fh.write(f'artifacts parsed: **{len(rows)}**\n\n')
              fh.write('| shard | tests | failures | errors | skipped |\n')
              fh.write('|---|---:|---:|---:|---:|\n')
              for name, t, f, e, s in rows:
                  fh.write(f'| {name} | {t} | {f} | {e} | {s} |\n')
              fh.write(f'| **total** | **{total}** | **{fails}** | '
                       f'**{errs}** | **{skipped}** |\n')
              if total:
                  fh.write(f'\npassed: {total - fails - errs - skipped} / {total}\n')
          print(f'total={total} failures={fails} errors={errs} skipped={skipped}')
          PY
      - name: Install dependencies for coverage census
        # route_coverage imports the application to enumerate its real url_map,
        # so it needs the same dependencies the matrix jobs install. Kept out of
        # the junit-parsing step above: that one only needs the standard
        # library, and a failure here must not take the run summary with it.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Route coverage
# Scenario count and endpoint coverage are different things. The matrix
          # runs 28350 scenarios, but a domain runner that cycles three paths
          # still produces 945 passes, so a fully green run can leave most of
          # the application untouched. This census reads the per-shard route reports
          # the matrix jobs uploaded and states the real number on the run page.
        run: |
          set -o pipefail
          # The floor is a ratchet, not decoration: raise it as modules get
          # covered, so a runner that stops reaching routes fails the
          # build instead of quietly shrinking coverage.
          #
          # 377/475 when the vertical suites were invisible to the census and
          # only the matrix was counted. Recording routes-slice.json plus the
          # stock/dashboard/owner/vault/customers/approvals/ar/security/
          # restapi/shipments/reports sweeps took it to 432/475.
          #
          # The sweep pools are deterministic (pool[_spread(sc, len(pool))]
          # over all 945 scenarios of a domain), so this is not a moving
          # target: 420 leaves room for shard variance while still failing
          # loudly on the ~50-route regressions the old 350 floor ignored.
          python -m tests.e2e.route_coverage 'artifacts/**/routes-*.json' \
            --min-covered 420 \
            --out route-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: route-coverage
          path: route-coverage.md
          if-no-files-found: warn
          retention-days: 14