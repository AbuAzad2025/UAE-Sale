database:
  - name: ERP_azad_lite_db
    databaseName: ERP_azad_lite
    user: azad_owner
    plan: starter
    region: frankfurt  # EU central — closest to UAE

services:
  - type: web
    name: uae-sale-app
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PORT=8001 APP_ENV=production python app.py"
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ERP_azad_lite_db
          property: connectionString
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_PASSWORD
        generateValue: true
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8001"
      - key: HOST
        value: "0.0.0.0"
      # The application directory is ephemeral on Render: the daily backups
      # and every uploaded file (customer logos, watermarks, product images)
      # would be wiped on each redeploy. DATA_DIR points them at the disk
      # mounted below.
      - key: DATA_DIR
        value: /data
      # The daily owner key is "<seed>@YYYY@MM@DD" (UTC date). Set the SAME
      # seed on every copy of this service so the key the operator holds works
      # on all of them. Leave it empty and each deployment falls back to the
      # seed file on the disk above (stable across redeploys of THIS service).
      - key: MASTER_KEY_SEED
        sync: false
    disk:
      name: uae-sale-disk
      mountPath: /data
      sizeGB: 1
