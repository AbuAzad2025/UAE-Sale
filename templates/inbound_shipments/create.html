{% extends "base.html" %}
{% block title %}شحنة واردة جديدة{% endblock %}
{% block content %}
<div class="container-fluid">
  <h3>شحنة واردة جديدة</h3>
  <form method="POST" id="inbound-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-md-3"><label class="form-label">المستودع المستقبل *</label><select name="warehouse_id" class="form-control" required>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select></div>
      <div class="col-md-3"><label class="form-label">المورد</label><select name="supplier_id" class="form-control"><option value="">—</option>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
      <div class="col-md-3"><label class="form-label">الناقل</label><input type="text" name="carrier" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">رقم التتبع</label><input type="text" name="tracking_number" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">متوقع</label><input type="date" name="expected_at" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">طلب شراء (اختياري)</label><select name="purchase_order_id" class="form-control"><option value="">—</option>{% for po in purchase_orders %}<option value="{{ po.id }}">{{ po.po_number }}</option>{% endfor %}</select></div>
      <div class="col-md-6"><label class="form-label">ملاحظات</label><input type="text" name="notes" class="form-control"></div>
    </div>
    <hr><h5>البنود</h5>
    <div class="border rounded p-3 mb-2">
      <div class="row g-2">
        <div class="col-md-6"><label>المنتج *</label><select name="lines[0][product_id]" class="form-control" required><option value="">اختر</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }} — {{ p.sku }}</option>{% endfor %}</select></div>
        <div class="col-md-3"><label>الكمية المتوقعة *</label><input type="number" step="0.001" name="lines[0][quantity_expected]" class="form-control" required></div>
        <div class="col-md-3"><label>سعر التكلفة</label><input type="number" step="0.001" name="lines[0][unit_cost]" class="form-control"></div>
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">حفظ الشحنة</button>
    <a href="{{ url_for('inbound_shipments.list_inbound') }}" class="btn btn-secondary mt-3">إلغاء</a>
  </form>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/barcode-unified.js') }}"></script>
{% endblock %}
