# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.ico'
      - '**.woff'
      - '**.woff2'
      - '**.ttf'
      - 'static/adminlte/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.svg'
      - '**.png'
      - '**.jpg'
      - '**.ico'
      - '**.woff'
      - '**.woff2'
      - '**.ttf'
      - 'static/adminlte/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint with flake8 (critical errors)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude='.git,venv,.venv,env,instance,node_modules,static,ai_knowledge/models,migrations'
        continue-on-error: true
      - name: Lint with flake8 (warnings)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=160 --statistics --exclude='.git,venv,.venv,env,instance,node_modules,static,ai_knowledge/models,migrations'

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
      - name: Bandit security scan
        run: bandit -c .bandit.yml -r .
        continue-on-error: true
      - name: Bandit JSON report
        if: always()
        run: bandit -c .bandit.yml -r . -f json -o bandit-report.json || true
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: pip-audit
        run: python -m pip_audit -r requirements.txt
        continue-on-error: true

  verify-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify app boots
        env:
          DATABASE_URL: "postgresql://azad_test:azad_test@localhost:5432/azad_test"
          SECRET_KEY: "test-secret-key-not-for-production"
          OWNER_PASSWORD: "TestOwner1234567890123456"
          APP_ENV: testing
        run: |
          python -c "from app import create_app; app = create_app()"

  # ── Unit tests (SQLite, fast, no services) ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run unit tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "test-secret-key-not-for-production"
          OWNER_PASSWORD: "TestOwner1234567890123456"
          APP_ENV: testing
          DEBUG: "true"
          WTF_CSRF_ENABLED: "false"
          RATELIMIT_ENABLED: "false"
          CACHE_TYPE: simple
        run: |
          pytest tests/unit/ -v --tb=short --cov=. --cov-config=.coveragerc --cov-report=term --cov-report=xml:coverage-unit.xml
      - name: Coverage summary on run page
        if: always()
        run: |
          {
            echo "## 📊 Unit Tests Coverage"
            echo ""
            TOTAL=$(python -m coverage report | grep -E "^TOTAL" || echo "N/A")
            echo "**\`$TOTAL\`**"
            echo ""
            echo "<details><summary>Full per-module breakdown</summary>"
            echo ""
            echo '```'
            python -m coverage report --show-missing
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate HTML coverage report
        if: always()
        run: python -m coverage html -d coverage-html-unit --title "UAE-Sale Unit Coverage" || true
      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-unit
          path: coverage-unit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html-unit
          path: coverage-html-unit/
          if-no-files-found: ignore
          retention-days: 14

  # ── Integration tests (real PostgreSQL, full workflow verification) ──
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run schema migration
        env:
          DATABASE_URL: "postgresql://azad_test:azad_test@localhost:5432/azad_test"
          SECRET_KEY: "test-secret-key-not-for-production"
          OWNER_PASSWORD: "TestOwner1234567890123456"
          APP_ENV: testing
          DEBUG: "true"
          FLASK_APP: "app:create_app"
        run: |
          echo "=== Checking DB connectivity ==="
          python -c "import psycopg2; conn=psycopg2.connect('postgresql://azad_test:azad_test@localhost:5432/azad_test'); print('DB OK'); conn.close()" || echo 'psycopg2 direct check failed'
          echo "=== Running flask db upgrade ==="
          flask db upgrade head 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== MIGRATION FAILED (exit code $EXIT_CODE) ==="
            flask db current 2>&1 || true
            exit $EXIT_CODE
          fi
          echo "=== Schema applied ==="
      - name: Run integration tests
        env:
          DATABASE_URL: "postgresql://azad_test:azad_test@localhost:5432/azad_test"
          SECRET_KEY: "test-secret-key-not-for-production"
          OWNER_PASSWORD: "TestOwner1234567890123456"
          APP_ENV: testing
          DEBUG: "true"
          WTF_CSRF_ENABLED: "false"
          RATELIMIT_ENABLED: "false"
          CACHE_TYPE: simple
        run: |
          pytest tests/integration/ -v --tb=short --cov=. --cov-config=.coveragerc --cov-report=term --cov-report=xml:coverage-integration.xml
      - name: Coverage summary on run page
        if: always()
        run: |
          {
            echo "## 📊 Integration Tests Coverage"
            echo ""
            TOTAL=$(python -m coverage report | grep -E "^TOTAL" || echo "N/A")
            echo "**\`$TOTAL\`**"
            echo ""
            echo "<details><summary>Full per-module breakdown</summary>"
            echo ""
            echo '```'
            python -m coverage report --show-missing
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate HTML coverage report
        if: always()
        run: python -m coverage html -d coverage-html-integration --title "UAE-Sale Integration Coverage" || true
      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-integration
          path: coverage-integration.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html-integration
          path: coverage-html-integration/
          if-no-files-found: ignore
          retention-days: 14

  repo-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
      - name: Upload Trivy results to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

  alembic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: azad_test
          POSTGRES_PASSWORD: azad_test
          POSTGRES_DB: azad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify migrations apply cleanly
        env:
          DATABASE_URL: "postgresql://azad_test:azad_test@localhost:5432/azad_test"
          SECRET_KEY: "test-secret-key-not-for-production"
          OWNER_PASSWORD: "TestOwner1234567890123456"
          APP_ENV: testing
          DEBUG: "true"
          FLASK_APP: "app:create_app"
        run: |
          echo "=== Checking Flask CLI ==="
          flask --version
          flask db upgrade head 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== MIGRATION FAILED (exit code $EXIT_CODE) ==="
            flask db current 2>&1 || true
            flask db history 2>&1 || true
            exit $EXIT_CODE
          fi
          echo "=== Migration applied successfully ==="
          flask db current
