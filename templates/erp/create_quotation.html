{% extends 'base.html' %}
{% block title %}عرض سعر جديد{% endblock %}
{% block page_title %}<i class="fas fa-plus mr-2"></i>عرض سعر جديد{% endblock %}
{% block content %}
<form method="POST">
  <div class="card"><div class="card-header"><h5 class="mb-0">بيانات عرض الأسعار</h5></div><div class="card-body">
    <div class="row">
      <div class="col-md-4"><div class="form-group"><label>العميل <span class="text-danger">*</span></label><select name="customer_id" class="form-control" required><option value="">— اختر —</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div></div>
      <div class="col-md-4"><div class="form-group"><label>المستودع</label><select name="warehouse_id" class="form-control"><option value="">— اختر —</option>{% for w in warehouses %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select></div></div>
      <div class="col-md-2"><div class="form-group"><label>العملة</label><select name="currency" class="form-control"><option value="AED">AED</option><option value="USD">USD</option></select></div></div>
      <div class="col-md-2"><div class="form-group"><label>صالح (أيام)</label><input type="number" name="valid_days" class="form-control" value="30"></div></div>
      <div class="col-md-3"><div class="form-group"><label>الخصم (د.إ)</label><input type="number" name="discount_amount" class="form-control" step="0.01" value="0"></div></div>
      <div class="col-md-3"><div class="form-group"><label>الشحن (د.إ)</label><input type="number" name="shipping_cost" class="form-control" step="0.01" value="0"></div></div>
      <div class="col-md-3"><div class="form-group"><label>الضريبة %</label><input type="number" name="tax_rate" class="form-control" step="0.01" value="5"></div></div>
    </div>
  </div></div>
  <div class="card"><div class="card-header"><h5 class="mb-0">بنود العرض</h5></div><div class="card-body">
    <table class="table" id="lines-table">
      <thead><tr><th>#</th><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الخصم%</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <button type="button" class="btn btn-success btn-sm" onclick="addLine()"><i class="fas fa-plus mr-1"></i>إضافة صف</button>
  </div></div>
  <div class="card"><div class="card-body">
    <div class="form-group"><label>ملاحظات</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
    <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save mr-2"></i>إنشاء عرض الأسعار</button>
    <a href="{{ url_for('erp_modules.quotations') }}" class="btn btn-secondary btn-lg">إلغاء</a>
  </div></div>
</form>
<script>
var lineIndex = 0;
var products = [{% for p in products %}{ id:{{ p.id }}, name:'{{ p.name }}', price:{{ p.regular_price|float }} }{% if not loop.last %},{% endif %}{% endfor %}];
function addLine(){
  var row = '<tr><td>'+(lineIndex+1)+'</td><td><select name="lines['+lineIndex+'][product_id]" class="form-control" onchange="setPrice(this,'+lineIndex+')"><option value="">— اختر —</option>'+products.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>'}).join('')+'</select></td><td><input type="number" name="lines['+lineIndex+'][quantity]" class="form-control" step="0.01" required></td><td><input type="number" name="lines['+lineIndex+'][unit_price]" class="form-control price-input" step="0.01"></td><td><input type="number" name="lines['+lineIndex+'][discount_percent]" class="form-control" step="0.01" value="0"></td><td><button type="button" class="btn btn-danger btn-sm" onclick="$(this).closest(\'tr\').remove()"><i class="fas fa-trash"></i></button></td></tr>';
  $('#lines-table tbody').append(row); lineIndex++;
}
function setPrice(sel,idx){var pid=$(sel).val();var p=products.find(function(x){return x.id==pid});if(p){$('input[name="lines['+idx+'][unit_price]"]').val(p.price)}}
addLine();
</script>
{% endblock %}
