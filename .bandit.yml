# Bandit security scanner configuration
# Excludes directories that are not production code

skips:
  # B101: assert used — common in Flask/Django, low risk in web apps
  - B101

exclude_dirs:
  - tests
  - migrations
  - venv
  - .venv
  - env
  - node_modules
  - instance
  - static
  - ai_knowledge/models

# Severity and confidence thresholds
# Only report medium+ severity AND medium+ confidence
# Lower-severity findings still appear in JSON report
severity: medium
confidence: medium
