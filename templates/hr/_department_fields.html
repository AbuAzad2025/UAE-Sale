{# Shared department fields (create: department is undefined; edit: department set). #}
<div class="row">
  <div class="col-md-6">
    <div class="form-group">
      <label>اسم القسم <span class="text-danger">*</span></label>
      <input type="text" name="name" class="form-control" value="{{ department.name if department else '' }}" required>
    </div>
  </div>
  <div class="col-md-6">
    <div class="form-group">
      <label>اسم القسم بالعربي</label>
      <input type="text" name="name_ar" class="form-control" value="{{ department.name_ar if department else '' }}">
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group">
      <label>الكود <span class="text-danger">*</span></label>
      <input type="text" name="code" class="form-control" value="{{ department.code if department else '' }}" required placeholder="مثال: IT">
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group">
      <label>القسم الأب</label>
      <select name="parent_id" class="form-control">
        <option value="">— بدون —</option>
        {% for d in parent_departments %}
        <option value="{{ d.id }}" {% if department and department.parent_id == d.id %}selected{% endif %}>{{ d.code }} - {{ d.name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group">
      <label>المدير</label>
      <select name="manager_id" class="form-control">
        <option value="">— بدون —</option>
        {% for m in managers %}
        <option value="{{ m.id }}" {% if department and department.manager_id == m.id %}selected{% endif %}>{{ m.full_name or m.username }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="col-md-6">
    <div class="form-group">
      <label>الميزانية الشهرية (د.إ)</label>
      <input type="number" name="budget_amount" class="form-control" step="0.01" value="{{ department.budget_amount if department else 0 }}">
    </div>
  </div>
  {% if department %}
  <div class="col-12">
    <div class="form-group">
      <label>الوصف</label>
      <textarea name="description" class="form-control" rows="3">{{ department.description or '' }}</textarea>
    </div>
  </div>
  {% endif %}
</div>
