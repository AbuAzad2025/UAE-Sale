{% extends 'base.html' %}
{% block page_title %}{{ t('New Bank Reconciliation') }}{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label>{{ t('Bank Account') }}</label>
    <select name="bank_account_id" class="form-control" required>
    {% for a in accounts %}<option value="{{ a.id }}">{{ a.code }} - {{ a.name }}</option>{% endfor %}
    </select></div>
  <div class="form-row">
    <div class="form-group col-md-6"><label>{{ t('From') }}</label><input type="date" name="period_start" class="form-control" value="{{ month_start }}" required></div>
    <div class="form-group col-md-6"><label>{{ t('To') }}</label><input type="date" name="period_end" class="form-control" value="{{ today }}" required></div>
  </div>
  <div class="form-group"><label>{{ t('Closing balance per bank statement') }}</label>
    <input type="number" step="0.001" name="closing_balance_per_bank" class="form-control" value="0" required></div>
  <button type="submit" class="btn btn-primary">{{ t('Create') }}</button>
</form>
</div></div>
{% endblock %}
