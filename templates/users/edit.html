{% extends 'base.html' %}

{% block title %}تعديل المستخدم - {{ user.username }}{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">
            <i class="fas fa-user-edit"></i> تعديل المستخدم - {{ user.username }}
          </h3>
        </div>
        <div class="card-body">
          <form method="post" action="{{ url_for('users.edit', id=user.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label>اسم المستخدم *</label>
                  <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                </div>
              </div>
              
              <div class="col-md-6">
                <div class="form-group">
                  <label>الاسم الكامل *</label>
                  <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label>البريد الإلكتروني</label>
                  <input type="email" name="email" class="form-control" value="{{ user.email or '' }}">
                </div>
              </div>
              
              <div class="col-md-6">
                <div class="form-group">
                  <label>الدور *</label>
                  <select name="role" class="form-control" required>
                    <option value="seller" {% if user.role == 'seller' %}selected{% endif %}>بائع</option>
                    <option value="accountant" {% if user.role == 'accountant' %}selected{% endif %}>محاسب</option>
                    <option value="warehouse" {% if user.role == 'warehouse' %}selected{% endif %}>أمين مخزن</option>
                    <option value="manager" {% if user.role == 'manager' %}selected{% endif %}>مدير</option>
                    {% if current_user.is_owner %}
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>مدير نظام</option>
                    {% endif %}
                  </select>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label>كلمة المرور الجديدة <small class="text-muted">(اتركه فارغاً لعدم التغيير)</small></label>
              <input type="password" name="password" class="form-control" minlength="10">
              <small class="text-muted">10+ أحرف، حرف كبير، رقم، رمز خاص</small>
            </div>

            <div class="form-group">
              <div class="custom-control custom-switch">
                <input type="checkbox" class="custom-control-input" id="is_active" name="is_active" {% if user.is_active %}checked{% endif %}>
                <label class="custom-control-label" for="is_active">مستخدم نشط</label>
              </div>
            </div>

            <!-- الصلاحيات -->
            {% if roles %}
            <div class="form-group">
              <label>الصلاحيات</label>
              <div class="row">
                {% for role in roles %}
                <div class="col-md-3">
                  <div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="perm_{{ role }}" name="permissions[]" value="{{ role }}">
                    <label class="custom-control-label" for="perm_{{ role }}">{{ role }}</label>
                  </div>
                </div>
                {% endfor %}
              </div>
            </div>
            {% endif %}

            <div class="form-group">
              <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> حفظ التعديلات
              </button>
              <a href="{{ url_for('users.view', id=user.id) }}" class="btn btn-secondary">
                <i class="fas fa-times"></i> إلغاء
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
